<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>LED indicator schematic</title><desc>Uin +12 V through LED D1 and resistor R back to Uin 0 V, with a multimeter measuring the voltage across R.</desc>
<g fill="none" stroke="var(--p)" stroke-width="1.2" stroke-linecap="round">
<path d="M94 80 H250 M280 80 H460 V120 M460 200 V240 H94"/>
<rect x="452" y="120" width="16" height="80" rx="2"/>
<path d="M300 240 V254 M290 254 H310 M294 259 H306 M298 264 H302"/>
</g>
<circle cx="90" cy="80" r="4" fill="none" stroke="var(--p)" stroke-width="1.2"/>
<circle cx="90" cy="240" r="4" fill="none" stroke="var(--p)" stroke-width="1.2"/>
<path d="M250 64 L250 96 L280 80 Z" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>
<path d="M280 64 V96" stroke="#A32D2D" stroke-width="2"/>
<g stroke="#E24B4A" stroke-width="1.2" fill="none" stroke-linecap="round"><path d="M262 58 L274 44 M268 60 L280 46"/><path d="M274 44 l-6 1 M274 44 l-1 6 M280 46 l-6 1 M280 46 l-1 6"/></g>
<circle cx="590" cy="160" r="22" fill="none" stroke="var(--p)" stroke-width="1.2"/>
<text class="th" x="590" y="160" text-anchor="middle" dominant-baseline="central">V</text>
<path d="M590 138 V100 H464" fill="none" stroke="#E24B4A" stroke-width="1.6"/>
<path d="M590 182 V220 H464" fill="none" stroke="var(--p)" stroke-width="1.6"/>
<circle cx="460" cy="100" r="3.5" fill="#E24B4A"/>
<circle cx="460" cy="220" r="3.5" fill="var(--p)"/>
<text class="th" x="78" y="80" text-anchor="end" dominant-baseline="central">Uin</text>
<text class="ts" x="78" y="98" text-anchor="end" dominant-baseline="central">+12 V</text>
<text class="th" x="78" y="240" text-anchor="end" dominant-baseline="central">Uin</text>
<text class="ts" x="78" y="258" text-anchor="end" dominant-baseline="central">0 V</text>
<text class="th" x="265" y="114" text-anchor="middle">D1</text>
<text class="ts" x="265" y="131" text-anchor="middle">LED, 2.5 V at 20 mA</text>
<text class="th" x="444" y="152" text-anchor="end">R</text>
<text class="ts" x="444" y="169" text-anchor="end">470 Ω, 0.5 W</text>
<text class="th" x="527" y="152" text-anchor="middle">Multimeter</text>
<text class="ts" x="527" y="169" text-anchor="middle">≈ 9.5 V</text>
<text class="ts" x="340" y="288" text-anchor="middle">The same 20 mA flows through D1 and R</text>
</svg>
